name: "Tests"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          # Upstream's Node 8 leg is dropped: the pinned dev toolchain
          # (rollup@2.49.0 engines >=10, eslint@7.27.0) hard-fails to
          # install on Node 8.
          node-version: '16'
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: npm run test:unit
      - name: Run Spec Tests 👩🏽‍💻
        run: npm run test:specs

  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: npm run build
      - name: Pack 📦
        run: npm pack
      - name: Upload Artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: marked-tgz
          path: marked-*.tgz
